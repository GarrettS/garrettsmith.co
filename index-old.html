<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal training and coaching for strength, mobility, and performance in Santa Clara, CA. NASM certified trainer specializing in corrective exercise, custom programs, and boxing fundamentals.">
    <meta name="keywords" content="personal trainer, Santa Clara, NASM, boxing, mobility training, corrective exercise, strength coaching">
    <meta name="author" content="Garrett Smith">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Garrett Smith - Personal Training & Coaching">
    <meta property="og:description" content="Movement is medicine. Personal training for strength, mobility, and performance in Santa Clara, CA.">
    <meta property="og:image" content="https://mybanned.com/wp-content/uploads/2023/05/facepic-car.png">
    <meta property="og:url" content="https://garrettsmith.co">
    <link rel="icon" type="image/png" href="https://mybanned.com/trainingpage/favicon-training-page.ico">

    <title>Garrett Smith - Personal Training & Coaching | Santa Clara, CA</title>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --accent-color: #6b5ce7;
            --link-color: #333333;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1a1a1a;
                --text-color: #e0e0e0;
                --text-muted: #a0a0a0;
                --accent-color: #8b7cff;
                --link-color: #e0e0e0;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: min(90vw, 1200px);
            margin: 0 auto;
            padding: clamp(2rem, 5vw, 4rem) clamp(1rem, 3vw, 2rem);
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(2rem, 4vw, 3rem);
            align-items: start;
        }

        @media (min-width: 768px) {
            .content-wrapper {
                grid-template-columns: 1fr 1fr;
                gap: clamp(3rem, 6vw, 5rem);
            }
        }

        header h1 {
            color: var(--accent-color);
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 600;
            margin-bottom: clamp(1.5rem, 3vw, 2rem);
        }

        .tagline {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 300;
            line-height: 1.2;
            margin-bottom: clamp(1rem, 2vw, 1.5rem);
        }

        .subtitle {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.3;
            margin-bottom: clamp(2rem, 4vw, 3rem);
        }

        .services {
            margin-bottom: clamp(2rem, 4vw, 3rem);
        }

        .services h2 {
            font-size: clamp(1rem, 2.5vw, 1.125rem);
            font-weight: 600;
            margin-bottom: clamp(0.75rem, 2vw, 1rem);
        }

        .services ul {
            list-style: none;
        }

        .services li {
            font-size: clamp(0.9rem, 2.2vw, 1rem);
            color: var(--text-muted);
            margin-bottom: clamp(0.4rem, 1vw, 0.5rem);
            padding-left: 0.5rem;
        }

        .services li::before {
            content: "- ";
            margin-right: 0.25rem;
        }

        .credentials {
            font-size: clamp(0.9rem, 2.2vw, 1rem);
            color: var(--text-muted);
        }

        .photo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(1.5rem, 3vw, 2rem);
        }

        .photo-container {
            width: 100%;
            max-width: 400px;
        }

        .photo {
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .contact {
            text-align: center;
            width: 100%;
        }

        .contact a {
            color: var(--link-color);
            text-decoration: underline;
            font-size: clamp(1rem, 2.5vw, 1.125rem);
            transition: opacity 0.2s ease;
            word-break: break-word;
        }

        .contact a:hover {
            opacity: 0.7;
        }

        @media (max-width: 767px) {
            .content-wrapper {
                grid-template-areas:
                    "header"
                    "photo"
                    "info";
            }

            header {
                grid-area: header;
            }

            .photo-section {
                grid-area: photo;
            }

            .info-section {
                grid-area: info;
            }
            
            .photo-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="content-wrapper">
            <section class="info-section">
                <header>
                    <h1>Garrett Smith</h1>
                </header>

                <h2 class="tagline">Movement is medicine</h2>
                
                <p class="subtitle">Personal training and coaching for strength, mobility, and performance.</p>

                <div class="services">
                    <h2>Services:</h2>
                    <ul>
                        <li>Mobility & corrective exercise</li>
                        <li>Custom-crafted programs</li>
                        <li>Boxing fundamentals</li>
                    </ul>
                </div>

                <p class="credentials">NASM CPT 7 | Santa Clara, CA</p>
            </section>

            <aside class="photo-section">
                <div class="photo-container">
                    <img src="https://mybanned.com/wp-content/uploads/2023/05/facepic-car.png" 
                         alt="Garrett Smith - Personal Trainer"
                         class="photo"
                         loading="lazy">
                </div>
                <div class="contact">
                    <a href="mailto:garrett@garrettsmith.co">garrett@garrettsmith.co</a>
                </div>
            </aside>
        </div>
    </main>
</body>
</html>
